name: Bug report
description: Something does not work as documented.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report.

        **Never paste tokens, refresh tokens, client secrets, account or customer IDs, campaign names or
        spend figures from a real account.** Replace them with placeholders such as `1234567890` or
        `act_123456789012345`. adops-guard masks known secrets in its own output, but check anyway.

        Security problems: please report them privately (Security tab, "Report a vulnerability"), not here.
  - type: input
    id: version
    attributes:
      label: adops-guard version
      description: Output of `adops-guard --version`.
      placeholder: adops-guard 0.1.0
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options:
        - Google Ads
        - Meta
        - Both / neither
    validations:
      required: true
  - type: textarea
    id: command
    attributes:
      label: Command
      description: The command you ran, with placeholders instead of real IDs.
      render: shell
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: What happened
      description: Output and exit code (use `--debug` for a redacted traceback). Remove real IDs.
      render: text
    validations:
      required: true
  - type: textarea
    id: doctor
    attributes:
      label: adops-guard doctor
      description: >-
        Optional, for setup problems: the output of `adops-guard doctor` (it never prints secrets, but
        replace account, customer and page IDs, names and amounts with placeholders).
        docs/troubleshooting.md may already list the fix.
      render: text
  - type: input
    id: environment
    attributes:
      label: Environment
      placeholder: macOS 15 / Ubuntu 24.04, Python 3.12, Google Ads API v25 / Graph API v26.0
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy
      options:
        - label: I removed tokens, account and customer IDs and campaign data from this report.
          required: true
