# adops-guard configuration (INI). Copy to ./adops-guard.ini and edit.
#
# Secrets never go in this file: adops-guard refuses keys that look like tokens or
# passwords. Tokens come from environment variables, a chmod 600 file, the macOS
# Keychain or AWS SSM Parameter Store (see README, "Credentials").
# The file must not be writable by other users (chmod go-w), or it is refused.
#
# Edit the lines that are here; do not paste a second [google] or [meta] block
# (each section and each key may appear only once). Only one platform? Delete the
# other platform's section. While a platform has no account id, no token source and
# no credentials, adops-guard doctor skips it.
#
# Every value below is a placeholder. After editing, run: adops-guard doctor
# (docs/setup.md walks through every console step).

[general]
# Journal (journal.jsonl), state (state.json) and lock live here. Relative paths are
# relative to this file. Created 0700; files inside are 0600.
state_dir = .adops-guard

[google]
# The account you work on (10 digits, dashes optional). Uncomment and set it in
# docs/setup.md, Google step 6 (adops-guard google accounts lists yours).
# customer_id = 123-456-7890
# Only if you reach that account through a manager (MCC) account:
# login_customer_id = 123-456-7890
# A google-ads.yaml with client_id, client_secret and refresh_token (chmod 600).
# Which file is used: this key if set, else $GOOGLE_ADS_CONFIGURATION_FILE_PATH,
# else ~/google-ads.yaml. The GOOGLE_ADS_CLIENT_ID, _CLIENT_SECRET and _REFRESH_TOKEN
# environment variables win over any file when all three are set.
# credentials_file = ~/google-ads.yaml
# Google Ads API version. "auto" probes from the newest version down.
api_version = v25
# Ceiling for spend increases: a budget raised above this, or a campaign enabled
# with a daily budget above this, is refused (unless --override-limit).
# Without a ceiling, every spend increase is refused. It applies to each budget
# you change or enable, not to the account total.
max_daily_budget = 50.00

[meta]
# Writes are limited to objects in this ad account. Uncomment and set it in
# docs/setup.md, Meta step 7.
# ad_account_id = act_123456789012345
api_version = v26.0
# Where the access token comes from: env | file | keychain | ssm. Uncomment ONE
# block (docs/setup.md, Meta step 6). Left out: $META_ACCESS_TOKEN if it is set,
# else $META_ACCESS_TOKEN_FILE.
# token_source = env
# token_env = META_ACCESS_TOKEN
#
# token_source = file
# token_file = ~/.config/adops-guard/meta-token
#
# token_source = keychain
# keychain_service = adops-guard-meta
# keychain_account = you
#
# token_source = ssm
# ssm_parameter = /adops-guard/meta-token
# ssm_region = us-east-1
# Stop sending requests when Meta's usage headers reach this percentage.
usage_stop_percent = 85
# Ceilings for spend increases (account currency), per budget you change or enable
# (for a campaign with ad set budgets: the sum of its active ad sets).
max_daily_budget = 50.00
max_lifetime_budget = 500.00
max_spend_cap = 1000.00
# Only for currencies missing from the built-in table (minor units per unit).
# currency_offset = 100

[audit]
# Thresholds of the click-quality audit (see docs/click-quality-audit.md).
min_clicks = 50
min_impressions = 1000
instream_ctr_ratio = 3.0
night_hours = 0-6
night_click_share = 0.40
night_ctr_ratio = 1.5
flagged_placement_share = 0.25
ctr_rise = 0.30
cpc_fall = 0.20
min_days = 6
age_undetermined_share = 0.40
# Extra words for channel names, comma separated (add your market's languages):
# extra_kids_keywords = bebe, nene
# extra_drama_keywords = serie, folge
