<!--
  Landing page snippet: Google Consent Mode v2, an App Store click conversion, and App Store campaign links.
  Part of adops-guard (https://github.com/deegitech/adops-guard), MIT licence.

  What it does
  1. Consent Mode v2 defaults. In the EEA (EU + Iceland, Liechtenstein, Norway), the United Kingdom and
     Switzerland, ad_storage, ad_user_data, ad_personalization and analytics_storage are DENIED until the
     visitor presses OK. Elsewhere ad_storage and ad_user_data default to granted. ad_personalization stays
     denied everywhere: this setup does no remarketing.
  2. A small banner (OK / No thanks). The choice is kept in localStorage; clearing site data resets it.
  3. A Google Ads conversion fires when someone clicks a link to apps.apple.com (your App Store button).
  4. If the page was opened with ?ct=<token> (put it in your ad's final URL), every link to your app is
     rewritten to the App Store Connect campaign link
         https://apps.apple.com/app/apple-store/id<APP_ID>?pt=<PROVIDER_TOKEN>&ct=<token>&mt=8
     so App Store Connect can count downloads per campaign. The token is kept for the browser session.

  Setup
  - Create the conversion action and copy the send_to value it prints:
        adops-guard google conversion-action create --name "Website: App Store button" --apply
  - Replace the placeholder values in ADOPS_CONFIG below.
  - Paste PART 1 into <head>, before any other Google tag. Paste PART 2 just before </body>.

  Consent mode
  - 'advanced' (default) loads the Google tag for everyone; while consent is denied it sends cookieless
    pings and sets no ad cookies.
  - 'basic' loads nothing from Google until the visitor presses OK (in every region, because the page
    cannot know the visitor's region by itself). You lose measurement for people who never press OK.

  This is not legal advice. Check which consent and privacy rules apply to your site, and describe the
  Google tag in your privacy policy.
-->

<!-- ============================ PART 1: in <head>, before other Google tags ============================ -->
<script>
  window.ADOPS_CONFIG = {
    googleTagId: 'AW-000000000',                         // your Google tag ID (Google Ads > Goals > Conversions)
    conversionSendTo: 'AW-000000000/REPLACE_WITH_LABEL', // printed by `adops-guard google conversion-action create`
    appStoreAppId: '1234567890',                         // the digits after "id" in your App Store URL
    providerToken: '000000',                             // App Store Connect provider token ("pt")
    consentMode: 'advanced',                             // 'advanced' or 'basic'
    storageKey: 'ads-consent',
    privacyUrl: '/privacy/'
  };

  window.dataLayer = window.dataLayer || [];
  function gtag() { window.dataLayer.push(arguments); }

  // EEA, United Kingdom and Switzerland: everything denied until the visitor says OK.
  gtag('consent', 'default', {
    ad_storage: 'denied', ad_user_data: 'denied', ad_personalization: 'denied', analytics_storage: 'denied',
    wait_for_update: 500,
    region: ['AT', 'BE', 'BG', 'HR', 'CY', 'CZ', 'DK', 'EE', 'FI', 'FR', 'DE', 'GR', 'HU', 'IS', 'IE', 'IT',
             'LV', 'LI', 'LT', 'LU', 'MT', 'NL', 'NO', 'PL', 'PT', 'RO', 'SK', 'SI', 'ES', 'SE', 'GB', 'CH']
  });
  // Everywhere else. ad_personalization stays denied: no remarketing.
  gtag('consent', 'default', {
    ad_storage: 'granted', ad_user_data: 'granted', ad_personalization: 'denied', analytics_storage: 'denied'
  });
  // Redact ad click identifiers while ad_storage is denied.
  gtag('set', 'ads_data_redaction', true);

  (function () {
    var cfg = window.ADOPS_CONFIG, saved = null;
    try { saved = window.localStorage.getItem(cfg.storageKey); } catch (e) { /* storage blocked */ }
    if (saved === 'granted' || saved === 'denied') {
      gtag('consent', 'update', { ad_storage: saved, ad_user_data: saved });
    }
    window.adopsLoadGoogleTag = function () {
      if (window.adopsGoogleTagLoaded) return;
      window.adopsGoogleTagLoaded = true;
      var script = document.createElement('script');
      script.async = true;
      script.src = 'https://www.googletagmanager.com/gtag/js?id=' + encodeURIComponent(cfg.googleTagId);
      document.head.appendChild(script);
      gtag('js', new Date());
      gtag('config', cfg.googleTagId);
    };
    if (cfg.consentMode !== 'basic' || saved === 'granted') window.adopsLoadGoogleTag();
  })();
</script>

<!-- ============================ PART 2: just before </body> ============================ -->
<div id="ads-consent" class="ads-consent" role="region" aria-label="Cookie choice" hidden>
  <p>We use one Google Ads cookie to see whether our ads bring visitors here. No analytics, no remarketing.
    <a id="ads-consent-privacy" href="/privacy/">Privacy</a></p>
  <button type="button" data-consent="granted">OK</button>
  <button type="button" data-consent="denied">No thanks</button>
</div>
<style>
  .ads-consent { position: fixed; left: 16px; right: 16px; bottom: 16px; z-index: 2147483000; max-width: 560px;
    margin: 0 auto; padding: 12px 16px; border: 1px solid #c8c8c8; border-radius: 10px; background: #fff; color: #111;
    box-shadow: 0 4px 20px rgba(0, 0, 0, .15); font: 14px/1.4 system-ui, -apple-system, sans-serif; }
  .ads-consent[hidden] { display: none; }
  .ads-consent p { margin: 0 0 8px; }
  .ads-consent button { margin-right: 8px; padding: 6px 14px; border: 1px solid #111; border-radius: 6px;
    background: #111; color: #fff; font: inherit; cursor: pointer; }
  .ads-consent button[data-consent="denied"] { background: transparent; color: #111; }
  @media (prefers-color-scheme: dark) {
    .ads-consent { background: #1c1c1e; color: #f2f2f2; border-color: #444; }
    .ads-consent a { color: #9cc4ff; }
    .ads-consent button { background: #f2f2f2; color: #111; border-color: #f2f2f2; }
    .ads-consent button[data-consent="denied"] { background: transparent; color: #f2f2f2; }
  }
</style>
<script>
  (function () {
    var cfg = window.ADOPS_CONFIG, box = document.getElementById('ads-consent'), saved = null;
    document.getElementById('ads-consent-privacy').href = cfg.privacyUrl;
    try { saved = window.localStorage.getItem(cfg.storageKey); } catch (e) { /* storage blocked */ }
    if (saved !== 'granted' && saved !== 'denied') box.hidden = false;
    box.addEventListener('click', function (event) {
      var choice = event.target.getAttribute && event.target.getAttribute('data-consent');
      if (choice !== 'granted' && choice !== 'denied') return;
      try { window.localStorage.setItem(cfg.storageKey, choice); } catch (e) { /* keep going */ }
      gtag('consent', 'update', { ad_storage: choice, ad_user_data: choice });
      if (choice === 'granted') window.adopsLoadGoogleTag();
      box.hidden = true;
    });

    // App Store campaign links: ?ct=<token> on this page becomes &ct=<token> on every link to your app.
    var ct = null;
    try {
      ct = new URLSearchParams(window.location.search).get('ct') || window.sessionStorage.getItem('ads-ct');
    } catch (e) { /* old browser or storage blocked */ }
    if (ct && /^[A-Za-z0-9_-]{1,40}$/.test(ct)) {
      try { window.sessionStorage.setItem('ads-ct', ct); } catch (e) { /* keep going */ }
      var appLink = new RegExp('/id' + cfg.appStoreAppId + '(?:[?#/]|$)');
      var campaignUrl = 'https://apps.apple.com/app/apple-store/id' + cfg.appStoreAppId +
        '?pt=' + encodeURIComponent(cfg.providerToken) + '&ct=' + encodeURIComponent(ct) + '&mt=8';
      var links = document.querySelectorAll('a[href*="apps.apple.com"]');
      for (var i = 0; i < links.length; i++) {
        if (appLink.test(links[i].href)) links[i].href = campaignUrl;
      }
    }

    // Conversion: a click on any App Store link. 'beacon' lets the hit survive the navigation.
    document.addEventListener('click', function (event) {
      var link = event.target.closest && event.target.closest('a[href*="apps.apple.com"]');
      if (!link) return;
      gtag('event', 'conversion', { send_to: cfg.conversionSendTo, transport_type: 'beacon' });
    });
  })();
</script>
