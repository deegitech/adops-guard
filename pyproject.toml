[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "adops-guard"
version = "0.1.0"
description = "Guard-railed command-line ad operations for the Google Ads API and the Meta Marketing API: dry run by default, validate, apply, read back, journal."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "DEEGITECH Teknoloji ve Yazılım Ltd. Şti." }]
keywords = [
  "google-ads",
  "google-ads-api",
  "meta-marketing-api",
  "facebook-ads",
  "instagram-ads",
  "advertising",
  "cli",
  "dry-run",
  "budget",
  "guardrails",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Intended Audience :: System Administrators",
  "Operating System :: MacOS",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Office/Business",
  "Topic :: Utilities",
  "Typing :: Typed",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff==0.16.10"]

[project.scripts]
adops-guard = "adops_guard.cli:main"

[project.urls]
Homepage = "https://github.com/deegitech/adops-guard"
Issues = "https://github.com/deegitech/adops-guard/issues"
Changelog = "https://github.com/deegitech/adops-guard/blob/main/CHANGELOG.md"
Security = "https://github.com/deegitech/adops-guard/security/policy"

[tool.hatch.build.targets.wheel]
packages = ["src/adops_guard"]

[tool.hatch.build.targets.sdist]
include = [
  "src",
  "tests",
  "docs",
  "examples",
  "snippets",
  "README.md",
  "README.tr.md",
  "LICENSE",
  "CHANGELOG.md",
  "SECURITY.md",
  "CONTRIBUTING.md",
  "CODE_OF_CONDUCT.md",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py310"
line-length = 120
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "BLE"]

[tool.ruff.lint.per-file-ignores]
# Test fixtures keep long literal rows on one line (with "fmt: skip") so each row reads as one record.
"tests/*" = ["BLE", "E501"]
